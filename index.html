<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Light Neon Blue CRUD Registration</title>

<style>
/* ===== Global ===== */
body {
  font-family: "Segoe UI", Arial, sans-serif;
  margin: 0;
  padding: 30px;

  /* Lighter overlay – cat image clearly visible */
  background:
    linear-gradient(
      rgba(0, 8, 20, 0.35),
      rgba(0, 26, 51, 0.45)
    ),
    url("https://images.unsplash.com/photo-1518791841217-8f162f1e1131?auto=format&fit=crop&w=1920&q=80")
    no-repeat center center fixed;

  background-size: cover;
}

/* ===== Layout ===== */
.container {
  max-width: 1000px;
  margin: auto;
}

/* ===== Neon Card ===== */
.card {
  background: rgba(255, 255, 255, 0.93);
  padding: 25px;
  border-radius: 16px;
  width: 420px;
  margin: auto;
  backdrop-filter: blur(6px);
  box-shadow:
    0 0 20px rgba(102, 204, 255, 0.7),
    0 15px 30px rgba(0, 0, 0, 0.25);
}

/* ===== Headings ===== */
h2, h3 {
  text-align: center;
  color: #4fc3ff;
  text-shadow: 0 0 8px rgba(102, 204, 255, 0.9);
}

/* ===== Labels ===== */
label {
  font-weight: 600;
  display: block;
  margin-top: 12px;
  color: #005b96;
}

/* ===== Inputs ===== */
input, select {
  width: 100%;
  padding: 10px;
  margin-top: 6px;
  background: #ffffff;
  border: 2px solid #ccefff;
  border-radius: 8px;
  box-shadow: inset 0 0 6px rgba(102, 204, 255, 0.35);
}

input:focus, select:focus {
  outline: none;
  border-color: #66ccff;
  box-shadow:
    0 0 12px rgba(102, 204, 255, 0.9),
    inset 0 0 8px rgba(102, 204, 255, 0.4);
}

/* ===== Main Button ===== */
button {
  width: 100%;
  padding: 12px;
  margin-top: 18px;
  background: linear-gradient(145deg, #66ccff, #4fc3ff);
  border: none;
  color: white;
  font-size: 16px;
  font-weight: bold;
  border-radius: 10px;
  cursor: pointer;
  box-shadow:
    0 0 18px rgba(102, 204, 255, 0.9),
    0 10px 25px rgba(79, 195, 255, 0.7);
  transition: 0.2s ease;
}

button:hover {
  transform: translateY(-3px);
  box-shadow:
    0 0 28px rgba(102, 204, 255, 1),
    0 14px 30px rgba(79, 195, 255, 0.9);
}

/* ===== Table ===== */
table {
  width: 100%;
  margin-top: 30px;
  border-collapse: collapse;
  background: white;
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 0 20px rgba(102, 204, 255, 0.6);
}

th {
  background: linear-gradient(145deg, #66ccff, #4fc3ff);
  color: white;
  padding: 10px;
}

td {
  padding: 10px;
  text-align: center;
  border-bottom: 1px solid #e0f7ff;
}

/* ===== Action Buttons ===== */
.edit-btn,
.delete-btn {
  border: none;
  padding: 6px 12px;
  border-radius: 6px;
  cursor: pointer;
}

.edit-btn {
  background: linear-gradient(145deg, #66ccff, #4fc3ff);
  color: white;
}

.delete-btn {
  background: linear-gradient(145deg, #90e0ff, #66ccff);
  color: #003b6f;
}
</style>
</head>

<body>

<div class="container">

  <div class="card">
    <h2>Register</h2>

    <form id="userForm">
      <input type="hidden" id="editIndex">

      <label>Name</label>
      <input id="name" required>

      <label>Email</label>
      <input type="email" id="email" required>

      <label>Password</label>
      <input type="password" id="password" required>

      <label>Gender</label>
      <select id="gender" required>
        <option value="">Select gender</option>
        <option>Male</option>
        <option>Female</option>
      </select>

      <label>Course</label>
      <input id="course" required>

      <label>Institution</label>
      <input id="institution" required>

      <label>Location</label>
      <input id="location" required>

      <label>Address</label>
      <input id="address" required>

      <button type="submit">Register</button>
    </form>
  </div>

  <h3>Registered Users</h3>

  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Gender</th>
        <th>Course</th>
        <th>Institution</th>
        <th>Location</th>
        <th>Address</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="userTable"></tbody>
  </table>

</div>

<script>
let users = [];

const form = document.getElementById("userForm");
const table = document.getElementById("userTable");

const nameInput = document.getElementById("name");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const genderInput = document.getElementById("gender");
const courseInput = document.getElementById("course");
const institutionInput = document.getElementById("institution");
const locationInput = document.getElementById("location");
const addressInput = document.getElementById("address");
const editIndexInput = document.getElementById("editIndex");

form.addEventListener("submit", e => {
  e.preventDefault();

  const user = {
    name: nameInput.value,
    email: emailInput.value,
    password: passwordInput.value,
    gender: genderInput.value,
    course: courseInput.value,
    institution: institutionInput.value,
    location: locationInput.value,
    address: addressInput.value
  };

  const index = editIndexInput.value;
  index === "" ? users.push(user) : users[index] = user;

  editIndexInput.value = "";
  form.reset();
  render();
});

function render() {
  table.innerHTML = "";
  users.forEach((u, i) => {
    table.innerHTML += `
      <tr>
        <td>${u.name}</td>
        <td>${u.email}</td>
        <td>${u.gender}</td>
        <td>${u.course}</td>
        <td>${u.institution}</td>
        <td>${u.location}</td>
        <td>${u.address}</td>
        <td>
          <button class="edit-btn" onclick="editUser(${i})">Edit</button>
          <button class="delete-btn" onclick="deleteUser(${i})">Delete</button>
        </td>
      </tr>`;
  });
}

function editUser(i) {
  const u = users[i];
  nameInput.value = u.name;
  emailInput.value = u.email;
  passwordInput.value = u.password;
  genderInput.value = u.gender;
  courseInput.value = u.course;
  institutionInput.value = u.institution;
  locationInput.value = u.location;
  addressInput.value = u.address;
  editIndexInput.value = i;
}

function deleteUser(i) {
  if (confirm("Are you sure you want to delete this user?")) {
    users.splice(i, 1);
    render();
  }
}
</script>


</body>
</html>
